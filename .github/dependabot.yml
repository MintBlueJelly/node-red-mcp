version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The test runtime has to equal the Node-RED that is deployed, so it moves by hand, with it.
    ignore:
      - dependency-name: node-red
