name: Docker Image CI

# Every push and pull request to main runs the tests. Only main publishes, and only a version that has
# no release yet, so a tag never moves: a change ships by bumping `version` in package.json.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The lockfile has no install scripts, and none from the dev tree gets to run here.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      # Against the Node-RED pinned in devDependencies, on Linux, where the SIGSTOP test runs too.
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: node-red-mcp.dockerfile
          load: true
          tags: node-red-mcp:smoke

      # A real MCP initialize, with a read-only root filesystem and no capabilities, as it runs in a
      # cluster. NODE_RED_URL points nowhere: the server must serve MCP while Node-RED is unreachable.
      - name: Smoke test
        run: |
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 8080:8080 -e NODE_RED_URL=http://127.0.0.1:1 node-red-mcp:smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          out=$(curl -s -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')
          docker logs smoke
          printf '%s\n' "$out" | head -c 2000
          printf '%s' "$out" | grep -q '"serverInfo"' || { echo "::error::no initialize response from the server"; exit 1; }

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # push the image
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish only when the release is missing for certain: any answer but 404 stops the job, and a
      # tag already in the registry without a release is an error rather than something to overwrite.
      - name: Decide whether to publish
        id: img
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          path=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          version=$(node -p "require('./package.json').version")
          echo "name=ghcr.io/$path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/tags/v$version")
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$version is already released"; exit 0 ;;
            404) ;;
            *) echo "::error::the release lookup answered $status"; exit 1 ;;
          esac
          token=$(curl -s -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?scope=repository:$path:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$path/manifests/$version")
          case "$code" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "::error::ghcr.io/$path:$version exists without a release"; exit 1 ;;
            *) echo "::error::the registry lookup answered $code"; exit 1 ;;
          esac

      - name: Log in to ghcr.io
        if: steps.img.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: steps.img.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: node-red-mcp.dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.name }}:latest

      # The digest decides what runs where the image is pinned by it, so the release carries it.
      - name: Create release
        if: steps.img.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ref="${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}@${{ steps.push.outputs.digest }}"
          gh release create "v${{ steps.img.outputs.version }}" --repo "$REPO" --target "$GITHUB_SHA" \
            --title "v${{ steps.img.outputs.version }}" --notes "Image: \`$ref\`"
