name: Docker Image CI

# Every push to main runs the tests. An image is published only for a version that has no release
# yet, so a tag never moves: a code change ships by bumping `version` in package.json, and a rebuild
# of an unchanged version stops after the smoke test. Use "Run workflow" to rerun.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # create the release
  packages: write # push image to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # Against the real Node-RED pinned in devDependencies, on Linux, where the SIGSTOP test runs too.
      - name: Integration tests
        run: npm run test:integration

      # GHCR requires a lowercase repository path, and `github.repository` preserves the owner's
      # casing — so the reference is built once here and reused.
      - name: Resolve image name and version
        id: img
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; this run tests and smoke-tests only"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: node-red-mcp.dockerfile
          load: true
          tags: ${{ steps.img.outputs.name }}:smoke

      # A real MCP initialize over HTTP. NODE_RED_URL points nowhere on purpose: the server must serve
      # MCP while Node-RED is unreachable, and reaching serverInfo proves the entrypoint and startup.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 -e NODE_RED_URL=http://127.0.0.1:1 "${{ steps.img.outputs.name }}:smoke"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          out=$(curl -s -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')
          docker logs smoke
          printf '%s\n' "$out" | head -c 2000
          printf '%s' "$out" | grep -q '"serverInfo"' || { echo "::error::no initialize response from the server"; exit 1; }

      - name: Log in to ghcr.io
        if: steps.img.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: steps.img.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: node-red-mcp.dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.name }}:latest

      # The digest decides what runs where the image is pinned by it, so the release carries it.
      - name: Create release
        if: steps.img.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}@${{ steps.push.outputs.digest }}"
          gh release create "v${{ steps.img.outputs.version }}" --target "$GITHUB_SHA" \
            --title "v${{ steps.img.outputs.version }}" --notes "Image: \`$ref\`"
